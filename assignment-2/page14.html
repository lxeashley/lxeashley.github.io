<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
        <title>chatroom cuties :3</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <style>
          #heart-wipe {
            position: absolute;
            top: 0;
            left: 0;
            width: 960px;
            height: 540px;
            background-color: #ff1493;
            z-index: 9999;
            pointer-events: none;
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: 0%;
            mask-size: 0%;
            transition: -webkit-mask-size 1.2s ease-in;
            transition: mask-size 1.2s ease-in opacity 0.1s;
          }
          
          #heart-wipe.active {
            opacity: 1;
            -webkit-mask-size: 800%;
            mask-size: 800%;
          }

          .game-viewport {
            width: 960px;
            height: 540px;
            position: relative;
            overflow: hidden;
            background-image: url(01images/background.jpg);
          }
          
          .ui-layer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
          }
          
          .text-frame {
            position: relative;
            width: 900px;
            height: 416.8px;
            display: flex;
            justify-content: center;
            align-items: center;
          }
          
          .frame-bg {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
          }
          
          .text-content {
            position: relative; 
            z-index: 2; 
            color: #f1f1f1;
            font-family: "Zalando Sans Expanded";
            font-weight: 400;
            font-size: 20px;
            width: max-content; 
            margin: 0 auto;
            padding: 40px;
            display: inline-block;
            white-space: nowrap; 
            overflow: hidden;
            animation: 
            typing 4s steps(36, end)forwards,
            blink-caret .5s step-end infinite;
            z-index: 2;
            text-align: center;
            max-width: 80%;
            pointer-events: none;
          }

          .button-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 940px;
            position: relative;
            z-index: 999
          }
          
          .action-btn {
            cursor: pointer;
            transition: transform 0.1s;
            height: 83.36px;
            width: auto;
            pointer-events: auto;
          }
          
          .action-btn:hover {
            transform: scale(1.1);
          }
          
          .action-btn:active {
            transform: scale(0.95);
          }
          
          .action-btn.disabled {
            filter: grayscale(100%) brightness(50%);
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.6;
          }

          body{
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:url(01images/background.jpg);
            overflow: hidden;
          }
          
          @keyframes typing {
            from { max-width: 0 }
            to { max-width: 100% }
          }

          @keyframes blink-caret {
            from, to { border-color: transparent }
          }
        </style>
  </head>
  
  <body>
    <div class="game-viewport"> <div id="heart-wipe"></div>
      <audio autoplay>
        <source src="02audio/chill-lofi-vibe-301602.mp3" type="audio/mp3">
      </audio>
      <div class="ui-layer">
        <div class="text-frame">
          <img src="01images/alex_99border.png" alt="border" class="frame-bg">
          <div class="text-content">Oh... I guess you are right. Anyways, I was wondering if you<br>would wanna grab a coffee together sometime? Maybe we could go<br>rock climbing too! No pressure at all though</div>
        </div>
        <div class="button-row">
          <audio id="click-sound" preload="auto">
            <source src="02audio/game-start-6104.mp3" type="audio/mp3">
          </audio>
          <img src="01images/chatbutton.png" class="action-btn disabled">
          <img src="01images/checkbutton.png" class="action-btn disabled">
          <img src="01images/blockbutton.png" class="action-btn"
           onclick="triggerHeartPopUp('You said: You are so lame...\n\nALEX_99 is now blocked.\n\nBeing overly hostile can lead to Cyberbullying/Trolling. While safety is key, aggressive blocking of everyone can lead to social isolation. Balance is everything!', 'page15.html')">
          <img src="01images/rejectbutton.png" class="action-btn"
          onclick="triggerHeartPopUp('You said: Sorry... I think I have decided I am not looking for a relationship.\n\nALEX_99 said: Alright... I understand...\n\nSometimes, the safest move is not to play. You stayed safe without being toxic. This proves you can navigate the internet with Kindness and Caution, the gold standard of online interaction.', 'page16.html')">
          <img src="01images/acceptbutton.png" class="action-btn"
          onclick="triggerHeartPopUp('You said: Of course! I would love to hang out soon!\n\nALEX_99 said: Oh really? Great! I will pick you up at 3pm this Saturday!\n\nA safe partner respects your boundaries and does not rush you for money or data. But maybe next time we should navigate the internet with Kindness and Caution, the gold standard of online interaction.', 'page18.html')">
      </div>
    </div>
  </body>

  <script>
  function triggerHeartPopUp(message, destination) {
    const startSound = document.getElementById('start-sound');
    if (startSound) startSound.play();

    if (window.confirm(message)) {
      const heartWipe = document.getElementById('heart-wipe');
      heartWipe.classList.add('active');
      
      setTimeout(() => {
        window.location.href = destination;
      }, 1200); 
    }
  }
  
  function triggerStandardPopUp(message, destination) {
    const startSound = document.getElementById('start-sound');
    if (startSound) startSound.play();

    if (window.confirm(message)) {
      window.location.href = destination;
    }
  }
  </script>

</html>
